plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.local.stwch'
    compileSdk 36
    defaultConfig {
        applicationId 'com.local.stwch'
        minSdk 26
        targetSdk 36
        versionCode 18
        versionName '1.0.17'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { release { debuggable false; signingConfig null; minifyEnabled false } }
}
dependencies {
    implementation 'androidx.core:core:1.19.1'
    testImplementation 'junit:junit:4.13.2'
}

apply from: rootProject.file("gradle/store-release.gradle")

apply from: rootProject.file("gradle/release-safety.gradle")
